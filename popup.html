<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Instagram MD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #fdf6ee;
      --surface:       #ffffff;
      --surface-hi:    #faf0e2;
      --surface-hover: #f5e8d3;
      --border:        #e8d3b8;
      --border-subtle: #f0e4d0;

      --gradient:     linear-gradient(135deg, #8b4513 0%, #c85a1a 50%, #f4913a 100%);
      --accent:       #c85a1a;
      --accent-hover: #d9681e;
      --accent-dim:   rgba(200, 90, 26, 0.1);

      --text:         #2d1608;
      --text-muted:   #8b6040;
      --text-dim:     #d4b49a;

      --success:  #15803d;
      --danger:   #dc2626;
      --warning:  #d97706;
      color-scheme: light;
    }

    /* ── Old Instagram top bar ──────────────────────────────────────── */
    .insta-top {
      height: 26px;
      background: linear-gradient(180deg, #5c2d0e 0%, #7a3f18 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #3d1c07;
    }
    .rainbow-stripe {
      display: flex;
      height: 13px;
      border-radius: 2px;
      overflow: hidden;
      gap: 1.5px;
    }
    .rainbow-stripe span { display: block; width: 9px; border-radius: 1px; }
    .rs-r { background: #e32929; }
    .rs-o { background: #f4901a; }
    .rs-y { background: #ffe03a; }
    .rs-g { background: #4caf50; }
    .rs-b { background: #2196f3; }
    .viewfinder {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #1a0d05;
      border: 2.5px solid #5a3010;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.5), 0 0 0 1px #8b6040;
      position: relative;
    }
    .viewfinder::after {
      content: '';
      position: absolute;
      top: 2px; left: 3px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(200,160,100,.25);
    }

    body {
      width: 380px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .container { padding: 14px 16px 16px; }

    /* ── Header ──────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 9px; }

    .brand-mark {
      width: 28px; height: 28px;
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-mark img { width: 100%; height: 100%; display: block; }

    .brand-name {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--accent);
    }
    .icon-btn svg { width: 14px; height: 14px; }

    /* ── Toolbar ─────────────────────────────────────────────────── */
    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 7px;
    }
    .select-all-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }
    #select-all-label {
      font-size: 12px;
      color: var(--text-muted);
    }
    .posts-count {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── List card ───────────────────────────────────────────────── */
    .list-card {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 10px;
      max-height: 280px;
      overflow-y: auto;
    }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
    }
    .empty-state p {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ── List items ──────────────────────────────────────────────── */
    .list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.12s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--surface-hi); }
    .list-item.selected { background: var(--accent-dim); }

    .checkbox {
      width: 17px; height: 17px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
      appearance: none; -webkit-appearance: none;
      position: relative;
      transition: all 0.15s;
      background: transparent;
    }
    .checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4px; top: 2px;
      width: 4px; height: 7px;
      border: solid #fff;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }
    .checkbox:indeterminate {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    .checkbox:indeterminate::after {
      content: '';
      position: absolute;
      left: 3px; top: 6px;
      width: 8px; height: 1.5px;
      background: var(--accent);
      border-radius: 1px;
    }

    /* ── Status dot ──────────────────────────────────────────────── */
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .s-queued    { background: var(--text-dim); }
    .s-processing { background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
    .s-done      { background: var(--success); }
    .s-failed    { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.45; transform: scale(0.75); }
    }

    .item-body { flex: 1; min-width: 0; }
    .item-title {
      font-size: 12.5px; font-weight: 500;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 5px;
    }
    .item-name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .item-link {
      color: var(--text-muted);
      text-decoration: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0; flex: 1;
      font-size: 11.5px;
      transition: color 0.12s;
    }
    .item-link:hover { color: var(--accent); }
    .item-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .badge {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .badge svg { width: 11px; height: 11px; }

    .remove-btn {
      width: 22px; height: 22px;
      border-radius: 6px; border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      transition: all 0.12s;
      opacity: 0;
    }
    .list-item:hover .remove-btn { opacity: 1; }
    .remove-btn:hover { background: rgba(248, 113, 113, 0.12); color: var(--danger); }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .action-row { display: flex; gap: 7px; margin-top: 10px; }

    .btn {
      flex: 1; height: 36px;
      border: none;
      border-radius: 9px;
      font-family: inherit; font-size: 13px; font-weight: 590;
      cursor: pointer;
      transition: opacity 0.15s, filter 0.15s, background 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-primary {
      background: var(--gradient);
      color: #fff;
    }
    .btn-primary:not(:disabled):hover { filter: brightness(1.1); }

    .btn-secondary {
      background: var(--surface-hi);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:not(:disabled):hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.07);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.18);
    }
    .btn-danger:not(:disabled):hover {
      background: rgba(248, 113, 113, 0.13);
    }

    .btn-ghost {
      width: 100%; height: 33px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-family: inherit; font-size: 12px; font-weight: 500;
      cursor: pointer;
      margin-top: 7px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover {
      background: var(--surface-hi);
      color: var(--text);
    }
    .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Status ──────────────────────────────────────────────────── */
    .status {
      min-height: 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    /* ── Preview ─────────────────────────────────────────────────── */
    .preview-section { margin-top: 10px; }
    .preview-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 500;
    }
    #markdown-preview {
      width: 100%; height: 92px;
      padding: 9px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-family: "SF Mono", "Fira Code", Menlo, monospace;
      font-size: 10.5px;
      color: var(--text);
      resize: none;
      line-height: 1.55;
    }
    #markdown-preview:focus { outline: none; border-color: var(--accent); }
    .preview-actions { display: flex; gap: 7px; margin-top: 7px; }

    /* ── Per-item progress fill ──────────────────────────────────── */
    .list-item[data-status="processing"] {
      position: relative;
    }
    .list-item[data-status="processing"]::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: var(--item-progress, 5%);
      background: linear-gradient(90deg,
        rgba(200, 90, 26, 0.10) 0%,
        rgba(244, 145, 58, 0.07) 100%
      );
      border-right: 2px solid rgba(200, 90, 26, 0.28);
      transition: width 0.6s ease;
      pointer-events: none;
      border-radius: 0;
    }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  </style>
</head>
<body>

  <!-- Old Instagram top bar: rainbow stripe + viewfinder -->
  <div class="insta-top">
    <div class="rainbow-stripe">
      <span class="rs-r"></span>
      <span class="rs-o"></span>
      <span class="rs-y"></span>
      <span class="rs-g"></span>
      <span class="rs-b"></span>
    </div>
    <div class="viewfinder"></div>
  </div>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="brand-mark" aria-hidden="true">
          <img src="icons/icon.svg" alt="">
        </div>
        <span class="brand-name">Instagram MD</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round">
          <circle cx="10" cy="10" r="2.5"/>
          <path d="M10 2.5V4M10 16v1.5M2.5 10H4M16 10h1.5
                   M4.7 4.7l1.06 1.06M14.24 14.24l1.06 1.06
                   M4.7 15.3l1.06-1.06M14.24 5.76l1.06-1.06"/>
        </svg>
      </button>
    </div>

    <!-- Toolbar: select-all + post count -->
    <div class="list-toolbar">
      <label class="select-all-wrap">
        <input type="checkbox" id="select-all" class="checkbox">
        <span id="select-all-label">Select all</span>
      </label>
      <span id="posts-count" class="posts-count"></span>
    </div>

    <!-- Unified post list -->
    <div class="list-card">
      <div id="posts-list">
        <div class="empty-state">
          <p>Save a post on Instagram<br>and it appears here</p>
        </div>
      </div>
    </div>

    <!-- Action row -->
    <div class="action-row">
      <button id="process-btn" class="btn btn-primary" disabled>Process</button>
      <button id="download-btn" class="btn btn-secondary" disabled>Download</button>
      <button id="clear-btn" class="btn btn-danger" style="display:none">Clear</button>
    </div>

    <button id="bulk-import-btn" class="btn-ghost">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0">
        <path d="M8 2v8M5 7l3 3 3-3M3 13h10"/>
      </svg>
      Bulk Import Saved
    </button>

    <div id="status" class="status"></div>
    <div id="preview-section" class="preview-section" style="display:none;">
      <div class="preview-label">Markdown preview</div>
      <textarea id="markdown-preview" spellcheck="false"></textarea>
      <div class="preview-actions">
        <button id="copy-btn" class="btn btn-secondary">Copy</button>
        <button id="download-md-btn" class="btn btn-secondary">Download</button>
      </div>
    </div>

  </div>
  <script src="encryption.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
