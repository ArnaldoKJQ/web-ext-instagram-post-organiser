<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram MD</title>
  <style>
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    :root {
      --accent: #cbb495;
      --accent-hover: #b89d7a;
      --accent-soft: #fecda5;
      --accent-soft-hover: #fdbb85;
      --text-on-accent: #3d2f1f;
      --bg: #f5eee1;
      --card-bg: #fffdf9;
      --track-bg: #e9dcc6;
      --border: #e5d8bf;
      --text-primary: #3d2f1f;
      --text-secondary: #8a7859;
      --hover-bg: #efe4d0;
    }
    body {
      margin: 0;
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
    }
    .container { padding: 16px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 2px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--track-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
      padding: 0;
    }
    .icon-btn:hover { background: var(--hover-bg); }
    .icon-btn svg { width: 17px; height: 17px; }

    /* Apple-style segmented control */
    .tabs {
      position: relative;
      display: flex;
      width: 100%;
      padding: 3px;
      background: var(--track-bg);
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .tab-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      height: 30px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 590;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.25s ease;
      border-radius: 7px;
    }
    .tab-btn.active { color: var(--text-primary); }
    .tab-slider {
      position: absolute;
      z-index: 1;
      top: 3px;
      left: 3px;
      width: calc(50% - 3px);
      height: 30px;
      background: var(--card-bg);
      border-radius: 7px;
      box-shadow: 0 1px 3px rgba(61,47,31,0.12), 0 1px 1px rgba(61,47,31,0.08);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* iOS-style list card */
    .list-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(61,47,31,0.05);
    }
    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 32px 16px;
      margin: 0;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 0.5px solid var(--border);
      transition: background 0.15s ease;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:active { background: var(--bg); }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #d3c2a5;
      flex-shrink: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      transition: all 0.15s ease;
    }
    .checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .item-body { flex: 1; min-width: 0; }
    .item-title {
      font-size: 13.5px;
      font-weight: 590;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .item-link {
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .item-link:hover { text-decoration: underline; }
    .item-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge { flex-shrink: 0; display: inline-flex; align-items: center; gap: 2px; }
    .badge svg { width: 12px; height: 12px; }

    .remove-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s ease;
    }
    .remove-btn:hover { background: #ff3b30; color: white; }

    /* Buttons */
    .action-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 590;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--text-on-accent); }
    .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--accent-soft); color: var(--text-on-accent); }
    .btn-secondary:not(:disabled):hover { background: var(--accent-soft-hover); }
    .btn-danger { background: #fff0ef; color: #ff3b30; }
    .btn-danger:not(:disabled):hover { background: #ffe0de; }

    .status {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      min-height: 16px;
      margin-top: 10px;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(61,47,31,0.35);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      width: 88%;
      max-width: 320px;
      box-shadow: 0 8px 30px rgba(61,47,31,0.25);
    }
    .modal-content h3 { margin: 0 0 6px 0; font-size: 15px; font-weight: 650; color: var(--text-primary); }
    .modal-content p { margin: 0 0 10px 0; font-size: 12.5px; color: var(--text-secondary); }
    .modal-content textarea {
      width: 100%; height: 76px; padding: 10px;
      border: 1px solid var(--border); border-radius: 10px;
      font-family: inherit; font-size: 12.5px; resize: none;
      background: var(--bg); color: var(--text-primary);
    }
    .modal-actions { margin-top: 12px; display: flex; gap: 8px; }

    .preview-section { margin-top: 12px; }
    .preview-section h3 { font-size: 13px; margin: 0 0 6px 0; color: var(--text-primary); }
    #markdown-preview {
      width: 100%; height: 100px; padding: 10px;
      border: 1px solid var(--border); border-radius: 10px;
      font-family: 'SF Mono', Menlo, monospace; font-size: 11px;
      background: var(--card-bg); color: var(--text-primary); resize: none;
    }
    .preview-actions { display: flex; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Instagram MD</h1>
      <button id="settings-btn" class="icon-btn" title="Settings">

      </button>
    </div>

    <div class="tabs">
      <div class="tab-slider" id="tab-slider"></div>
      <button class="tab-btn active" data-tab="queue">Queue (<span id="queue-count">0</span>)</button>
      <button class="tab-btn" data-tab="processed">Processed (<span id="processed-count">0</span>)</button>
    </div>

    <!-- Queue Tab -->
    <div id="queue" class="tab-content active">
      <div class="list-card">
        <div id="queue-list">
          <p class="empty-state">No posts queued.</p>
        </div>
      </div>
      <div class="action-row">
        <button id="process-btn" class="btn btn-primary" disabled>Process Selected</button>
        <button id="transcribe-btn" class="btn btn-secondary" disabled><span id="transcribe-icon" style="display:inline-flex;vertical-align:middle;width:13px;height:13px;margin-right:3px;"></span><span id="transcribe-label">Transcribe</span></button>
      </div>
      <div class="action-row" style="margin-top:6px;">
        <button id="bulk-import-btn" class="btn btn-secondary">📥 Bulk Import Saved</button>
      </div>
    </div>

    <!-- Processed Tab -->
    <div id="processed" class="tab-content">
      <div class="list-card">
        <div id="processed-list">
          <p class="empty-state">No posts processed yet.</p>
        </div>
      </div>
      <div class="action-row">
        <button id="download-all-btn" class="btn btn-primary">Download All</button>
        <button id="clear-btn" class="btn btn-danger">Clear All</button>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div id="preview-section" class="preview-section" style="display:none;">
      <h3>Markdown Preview</h3>
      <textarea id="markdown-preview" readonly></textarea>
      <div class="preview-actions">
        <button id="copy-btn" class="btn btn-secondary">Copy</button>
        <button id="download-btn" class="btn btn-secondary">Download</button>
      </div>
    </div>
  </div>

  <script src="encryption.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
